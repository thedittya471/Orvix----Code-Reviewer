services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orvix
      POSTGRES_USER: orvix
      POSTGRES_PASSWORD: orvix
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orvix -d orvix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
